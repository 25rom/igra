<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Игра типов — локальная версия</title>
<meta name="description" content="Коротко и с юмором о том, как Юнг разделил людей на типы: четыре функции, две установки и тень. Потом — тест.">
<meta property="og:title" content="Игра типов">
<meta property="og:description" content="Четыре функции, две установки и тень. Юнгианская типология без серьёзного лица.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#DCD8EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191734" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pangolin&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --paper:#DCD8EE; --paper-2:#EEEBF7; --ink:#26235E; --ink-2:#5D5A96;
  --sun:#F2BE2E; --night:#14122E; --night-ink:#F2BE2E;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --hand:"Pangolin", "Comic Sans MS", "Segoe Print", cursive;
  --line:3px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#191734; --paper-2:#24214A; --ink:#E7E3FA; --ink-2:#A9A5D6;
  }
}
:root[data-theme="dark"]{ --paper:#191734; --paper-2:#24214A; --ink:#E7E3FA; --ink-2:#A9A5D6; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; height:100%; background:var(--paper); color:var(--ink);
  font-family:var(--hand); font-size:18px; line-height:1.45;
  display:flex; flex-direction:column; overflow-x:hidden;
}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--sun); outline-offset:3px}

/* ---------- top bar ---------- */
.bar{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; gap:12px}
.brand{font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:-.01em; background:none; border:0; padding:0}
.skip{font-size:15px; color:var(--ink-2); background:none; border:0; text-decoration:underline; text-underline-offset:3px; padding:4px 0}

/* ---------- stage ---------- */
#app{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 16px 20px; min-height:0}
.screen{width:100%; max-width:460px; display:flex; flex-direction:column; gap:18px}

/* ---------- comic panel ---------- */
.panel{
  position:relative; background:var(--paper-2); border:var(--line) solid var(--ink);
  box-shadow:6px 6px 0 var(--ink); padding:0; cursor:pointer; user-select:none;
}
.panel svg{display:block; width:100%; height:auto}
.caption{
  position:relative; display:inline-block; margin:-14px 0 -6px -8px; max-width:86%; z-index:2;
  background:var(--sun); color:#26235E; border:var(--line) solid var(--ink);
  padding:8px 12px; font-size:16px; line-height:1.3; transform:rotate(-1.5deg);
}
.bubble{
  position:absolute; background:#fff; color:#26235E; border:var(--line) solid var(--ink);
  border-radius:22px; padding:10px 14px; font-size:17px; line-height:1.3; max-width:52%;
}
.bubble::after{
  content:""; position:absolute; width:18px; height:18px; background:#fff;
  border-right:var(--line) solid var(--ink); border-bottom:var(--line) solid var(--ink);
}
.bubble.tail-bl::after{left:26px; bottom:-11px; transform:rotate(45deg) skew(10deg,10deg)}
.bubble.tail-br::after{right:26px; bottom:-11px; transform:rotate(45deg) skew(10deg,10deg)}
.bubble.tail-tl::after{left:26px; top:-11px; transform:rotate(225deg) skew(10deg,10deg)}
.narr{font-size:19px; text-align:left; margin:4px 2px 0}

.row{display:flex; align-items:center; justify-content:space-between; gap:12px}
.pips{display:flex; gap:6px}
.pip{width:14px; height:14px; border:2px solid var(--ink); background:transparent}
.pip.on{background:var(--ink)}
.btn{
  font-family:var(--display); font-weight:700; font-size:14px;
  background:var(--ink); color:var(--paper); border:var(--line) solid var(--ink);
  padding:12px 18px; box-shadow:4px 4px 0 var(--sun); transition:transform .12s, box-shadow .12s;
}
.btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--sun)}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:none}
.btn[disabled]{opacity:.3; cursor:default}

/* ---------- deck ---------- */
.deck{position:relative; height:min(560px, 68vh); touch-action:pan-y}
.card{
  position:absolute; inset:0; background:var(--paper-2); color:var(--ink);
  border:var(--line) solid var(--ink); box-shadow:6px 6px 0 var(--ink);
  padding:22px 22px 20px; display:flex; flex-direction:column; gap:10px; overflow:auto;
  transform-origin:50% 100%; will-change:transform;
}
.card.behind-1{transform:translate(8px,8px) rotate(2deg); z-index:1}
.card.behind-2{transform:translate(16px,14px) rotate(-2deg); z-index:0}
.card.top{z-index:2; cursor:grab; touch-action:pan-y}
.card.top.drag{cursor:grabbing; transition:none}
.card.anim{transition:transform .28s ease-out, opacity .28s}
.card.behind-1 > *, .card.behind-2 > *{visibility:hidden}
.card .glyph{width:96px; height:96px; flex:none}
.card h2{font-family:var(--display); font-weight:800; font-size:clamp(26px,7vw,34px); line-height:1.05; margin:4px 0 0; letter-spacing:-.02em}
.card .lead{font-size:20px; margin:0}
.card .lead span{background:linear-gradient(transparent 55%, var(--sun) 55%); -webkit-box-decoration-break:clone; box-decoration-break:clone; padding:0 2px}
.card .body{margin:0}
.card .life{margin:auto 0 0; padding-top:10px; border-top:2px dashed var(--ink-2); font-size:17px}
.card .life b{font-weight:400; color:var(--ink-2)}
.card.shadow{background:var(--night); color:#EDE9FF; border-color:var(--night); box-shadow:6px 6px 0 var(--sun)}
.card.shadow .lead span{background:linear-gradient(transparent 55%, #4B3F8F 55%)}
.card.shadow .life{border-color:#6C66A8}
.card.shadow .life b{color:var(--night-ink)}
.card.finale{background:var(--sun); color:#26235E; justify-content:center}
.card.finale .btn{align-self:flex-start; margin-top:12px; background:#26235E; color:#F2BE2E; box-shadow:4px 4px 0 #fff; border-color:#26235E}
.count{font-family:var(--display); font-size:13px; font-weight:500; color:var(--ink-2)}
.hint{font-size:15px; color:var(--ink-2); text-align:center; margin:0}

/* ---------- test stub ---------- */
.stub h1{font-family:var(--display); font-weight:800; font-size:clamp(28px,8vw,40px); line-height:1.05; margin:0; letter-spacing:-.02em}
.stub p{margin:0; max-width:36ch}
.eco{border-top:2px solid var(--ink); padding-top:14px; font-size:16px; display:flex; flex-wrap:wrap; gap:6px 18px; color:var(--ink-2)}
.eco a{color:var(--ink); text-underline-offset:3px}

/* ---------- svg ink ---------- */
.s-ink{stroke:var(--ink); fill:none; stroke-width:4; stroke-linecap:round; stroke-linejoin:round}
.f-ink{fill:var(--ink)} .f-paper{fill:var(--paper-2)} .f-sun{fill:var(--sun)} .f-white{fill:#fff}
.card.shadow .s-ink{stroke:#EDE9FF} .card.shadow .f-ink{fill:#EDE9FF}
.lbl{font-family:var(--hand); font-size:20px; fill:var(--ink)}


/* ---------- chat test ---------- */
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
#app.full{justify-content:flex-start; align-items:stretch; padding-bottom:12px}
.chat{width:100%; max-width:600px; margin:0 auto; height:100%; display:flex; flex-direction:column; min-height:0}
.chat-head{display:flex; justify-content:space-between; align-items:center; padding:2px 2px 10px}
.log{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:6px 4px 16px}
.msg{max-width:84%; padding:10px 14px; border:var(--line) solid var(--ink); border-radius:20px; white-space:pre-wrap; line-height:1.35}
.msg.bot{align-self:flex-start; background:#fff; color:#26235E; border-bottom-left-radius:4px}
.msg.bot.q{background:var(--paper-2); color:var(--ink); box-shadow:4px 4px 0 var(--ink); font-size:19px}
.msg.me{align-self:flex-end; background:var(--sun); color:#26235E; border-bottom-right-radius:4px}
.msg.typing{opacity:.8; animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.composer{display:flex; gap:10px; align-items:flex-end; border-top:var(--line) solid var(--ink); padding-top:12px}
.composer textarea{flex:1; resize:none; font:inherit; font-size:18px; color:var(--ink); background:var(--paper-2); border:var(--line) solid var(--ink); padding:10px 12px; min-height:52px; max-height:180px}
.composer textarea::placeholder{color:var(--ink-2)}
.err{margin:0; font-size:16px}
.taps{display:flex; flex-direction:column; gap:10px; width:100%}
.taps .btn{text-align:left; font-family:var(--hand); font-weight:400; font-size:18px}
.composer.stack{flex-direction:column; align-items:flex-start}
/* ---------- result ---------- */
.result{width:100%; max-width:600px; margin:0 auto; overflow-y:auto; height:100%; display:flex; flex-direction:column; gap:18px; padding:4px 4px 28px}
.r-hero{background:var(--sun); color:#26235E; border:var(--line) solid var(--ink); box-shadow:6px 6px 0 var(--ink); padding:22px}
.r-kicker{margin:0; font-size:17px}
.r-hero h1{font-family:var(--display); font-weight:800; font-size:clamp(30px,8vw,44px); line-height:1.02; margin:4px 0 8px; letter-spacing:-.02em}
.r-stack{margin:0 0 12px; font-size:17px; color:#4A4680}
.r-portrait{margin:0; font-size:19px}
.rcard{background:var(--paper-2); border:var(--line) solid var(--ink); box-shadow:6px 6px 0 var(--ink); padding:18px 20px}
.rcard h2{font-family:var(--display); font-weight:700; font-size:20px; margin:0 0 8px; letter-spacing:-.01em}
.rcard p{margin:0}
.rcard.shadow{background:var(--night); color:#EDE9FF; border-color:var(--night); box-shadow:6px 6px 0 var(--sun)}
.axis{padding:10px 0; border-top:2px dashed var(--ink-2)}
.axis:first-of-type{border-top:0; padding-top:0}
.axis-top b{font-weight:400; color:var(--ink-2)}
.meter{display:flex; gap:5px; margin:6px 0}
.meter i{width:28px; height:10px; border:2px solid var(--ink)}
.meter i.on{background:var(--ink)}
.axis-q{font-size:16px; margin:2px 0 0 !important}
.axis-why{font-size:15px; color:var(--ink-2)}
.note{font-size:15px; color:var(--ink-2); margin-top:10px !important}
.r-actions{display:flex; gap:12px; flex-wrap:wrap}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
}
@media (min-width:760px){
  .screen{max-width:520px}
  .caption{font-size:17px}
}
</style>
</head>

<script>

const app = document.getElementById("app");

function go(route){ if(location.hash.slice(1)===route) render(); else location.hash = route; }
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go]"); if(t){ e.preventDefault(); go(t.dataset.go); }
});
addEventListener("hashchange", render);

function render(){
  app.classList.remove("full");
  const r = location.hash.slice(1) || "intro-1";
  const [kind, n] = r.split("-"); const i = Math.max(1, parseInt(n)||1);
  if(kind==="deck") return renderDeck(Math.min(i, DECK.length));
  if(kind==="test") return renderTest();
  return renderIntro(Math.min(i, INTRO.length));
}

function bubble(text,pos,tail){ return text ? `<div class="bubble ${tail}" style="${pos}">${text}</div>` : ""; }

function renderIntro(i){
  const p = INTRO[i-1], last = i===INTRO.length;
  const next = last ? "deck-1" : `intro-${i+1}`;
  app.innerHTML = `
  <section class="screen" aria-label="Предыстория, кадр ${i} из ${INTRO.length}">
    <div class="panel" data-go="${next}" role="button" tabindex="0" aria-label="Следующий кадр">
      <div class="caption">${p.caption}</div>
      ${p.art}
      ${bubble(p.bubble,p.pos,p.tail)}${bubble(p.bubble2,p.pos2,p.tail2)}
    </div>
    ${p.narr ? `<p class="narr">${p.narr}</p>` : ""}
    <div class="row">
      <div class="pips" aria-hidden="true">${INTRO.map((_,k)=>`<span class="pip ${k<i?'on':''}"></span>`).join("")}</div>
      <button class="btn" data-go="${next}">${last ? "Смотреть фигуры" : "Дальше"}</button>
    </div>
  </section>`;
  app.querySelector(".panel").addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(next);} });
}

function cardHTML(c, cls){
  if(c.finale) return `<article class="card finale ${cls}">
      <h2>${c.name}</h2><p class="body">${c.body}</p>
      <button class="btn" data-go="test">Пройти тест</button></article>`;
  return `<article class="card ${c.shadow?'shadow':''} ${cls}">
      ${GLYPH[c.g]}<h2>${c.name}</h2><p class="lead"><span>${c.lead}</span></p>
      <p class="body">${c.body}</p><p class="life"><b>в жизни:</b> ${c.life}</p></article>`;
}

function renderDeck(i){
  const cur = DECK[i-1], n1 = DECK[i], n2 = DECK[i+1];
  app.innerHTML = `
  <section class="screen" aria-label="Фигуры игры, карточка ${i} из ${DECK.length}">
    <div class="deck">
      ${n2 ? cardHTML(n2,"behind-2") : ""}${n1 ? cardHTML(n1,"behind-1") : ""}${cardHTML(cur,"top")}
    </div>
    <div class="row">
      <button class="btn ghost" ${i===1?'disabled':''} data-go="deck-${i-1}" aria-label="Предыдущая карточка">Назад</button>
      <span class="count">${i} из ${DECK.length}</span>
      ${i<DECK.length ? `<button class="btn" id="nextBtn">Дальше</button>` : `<span style="width:96px"></span>`}
    </div>
    ${i===1 ? `<p class="hint">Листай карточки пальцем или стрелками</p>` : ""}
  </section>`;
  const top = app.querySelector(".card.top");
  const nb = document.getElementById("nextBtn");
  if(nb) nb.onclick = ()=>fly(top,-1,i);
  dragify(top,i);
}

function fly(card,dir,i){
  const target = dir<0 ? i+1 : i-1;
  if(target<1 || target>DECK.length) return snap(card);
  if(reduce) return go(`deck-${target}`);
  card.classList.add("anim");
  card.style.transform = `translateX(${dir*130}%) rotate(${dir*14}deg)`;
  card.style.opacity = "0";
  setTimeout(()=>go(`deck-${target}`), 240);
}
function snap(card){ card.classList.add("anim"); card.style.transform=""; }

function dragify(card,i){
  let x0=null, dx=0;
  card.addEventListener("pointerdown", e=>{
    if(e.target.closest("button")) return;
    x0=e.clientX; dx=0; card.classList.remove("anim"); card.classList.add("drag");
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener("pointermove", e=>{
    if(x0===null) return; dx=e.clientX-x0;
    card.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;
  });
  const end=()=>{
    if(x0===null) return; x0=null; card.classList.remove("drag");
    if(dx<-80) fly(card,-1,i); else if(dx>80) fly(card,1,i); else snap(card);
  };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}

addEventListener("keydown", e=>{
  if(!location.hash.startsWith("#deck")) return;
  const i = parseInt(location.hash.split("-")[1])||1, top=app.querySelector(".card.top");
  if(e.key==="ArrowRight") fly(top,-1,i);
  if(e.key==="ArrowLeft") fly(top,1,i);
});

function stackOf(code){
  const [ei,sn,tf,jp] = code.split("");
  const ext = jp==="J" ? tf : sn, int = jp==="J" ? sn : tf;
  const dom = ei==="E" ? ext+"e" : int+"i", aux = ei==="E" ? int+"i" : ext+"e";
  const opp = {S:"N",N:"S",T:"F",F:"T"};
  const inf = opp[dom[0]] + (dom[1]==="e" ? "i" : "e");
  const nm = f => ADJ(f[0],f[1]) + " " + FN[f[0]];
  return { dom, aux, inf, domName:nm(dom), auxName:nm(aux), infName:nm(inf),
           title: TITLES[`${dom[0]}${dom[1]}-${aux[0]}${aux[1]}`] || "Твой тип" };
}

const WHY = { E:"Энергию берёшь в контакте и движении.", I:"Энергию восстанавливаешь наедине с собой.",
  S:"Опираешься на конкретику и детали.", N:"Тебя ведут смыслы и возможности.",
  T:"Решаешь по логике и критериям.", F:"Решаешь с оглядкой на ценности и людей.",
  J:"Предпочитаешь план и завершённость.", P:"Предпочитаешь открытые варианты и поток." };

function hits(text, list){ const t=" "+text.toLowerCase().replace(/ё/g,"е")+" "; return list.filter(m=>t.includes(m.replace(/ё/g,"е"))); }
function quoteFor(answers, markers){
  for(const a of answers){ for(const sent of a.split(/(?<=[.!?…])\s+|,\s+/)){ if(hits(sent,markers).length) return sent.trim().split(/\s+/).slice(0,12).join(" "); } }
  return "";
}
function localAnalyze(){
  const AX = ["EI","SN","TF","JP"], score = {}, own = {};
  AX.forEach(k=>{ score[k]=0; own[k]=[]; });
  QUESTIONS.forEach((q,i)=>{
    const a = T.answers[i]||"";
    AX.forEach(k=>{
      const w = q.axis===k ? 1 : 0.5;            // свой вопрос весит больше
      score[k] += w*(hits(a,MARK[k[0]]).length - hits(a,MARK[k[1]]).length);
      if(q.axis===k) own[k].push(a);
    });
    const tap = T.taps[i]; if(tap){ const k = AX.find(x=>x.includes(tap)); score[k] += tap===k[0] ? 2 : -2; }
  });
  let code = AX.map(k=> score[k]>0 ? k[0] : score[k]<0 ? k[1] : k[1]).join("");
  // проверка по стрессу: низшая функция подсказывает ведущую
  const g = Object.entries(GRIP).map(([d,l])=>[d,hits(T.answers[8]||"",l).length]).sort((a,b)=>b[1]-a[1])[0];
  let gripNote = "";
  if(g && g[1]>0){
    const dom = g[0];
    const cands = ["E","I"].flatMap(e=>["S","N"].flatMap(s=>["T","F"].flatMap(t=>["J","P"].map(j=>e+s+t+j)))).filter(c=>stackOf(c).dom===dom);
    const cost = c => AX.reduce((sum,k,i)=> sum + (c[i]===code[i] ? 0 : Math.abs(score[k])+0.5), 0);
    const best = cands.sort((a,b)=>cost(a)-cost(b))[0];
    if(best && cost(best) <= 3.5 && best!==code){ gripNote = "Тип уточнён по ответу о стрессе."; code = best; }
  }
  const axes = {};
  AX.forEach((k,i)=>{
    const pole = code[i], s = Math.abs(score[k]);
    axes[k] = { pole, strength: s>=4 ? 3 : s>=2 ? 2 : 1, quote: quoteFor(own[k], MARK[pole]), why: WHY[pole] };
  });
  const total = AX.reduce((s,k)=>s+Math.abs(score[k]),0);
  axes.confidence = total>=14 ? "высокая" : total>=7 ? "средняя" : "низкая";
  const st = stackOf(code), d = DOM[st.dom.slice(0,1)+st.dom.slice(1)] || DOM[st.dom];
  const key = st.dom[0]+st.dom[1];
  const D = DOM[key];
  const cards = { portrait:D.portrait, power:D.power, support:AUX[st.aux[0]+st.aux[1]], shadow:INF[st.inf[0]+st.inf[1]],
    hard:D.hard, solve:D.solve, challenge:D.challenge, line:D.line };
  return { code, axes, cards, gripNote, at:Date.now() };
}

/* ---------- журнал прохождений на этом компьютере ---------- */
const LOG = "igra-tipov:journal:v1";
function journal(){ try{ return JSON.parse(localStorage.getItem(LOG))||[]; }catch(e){ return []; } }
function addJournal(r){ try{ const j=journal(); j.push({ at:new Date(r.at).toLocaleString("ru-RU"), code:r.code, title:stackOf(r.code).title, answers:T.answers }); localStorage.setItem(LOG, JSON.stringify(j)); }catch(e){} }
async function saveFile(name, blob){
  try{
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if(dl){ await dl.save({ filename:name, data:blob }); return; }
  }catch(e){ return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
}
function downloadCSV(){
  const q = s => '"'+String(s).replace(/"/g,'""')+'"';
  const rows = [["Дата","Тип","Ведущая","Опора", ...QUESTIONS.map((_,i)=>"Ответ "+(i+1))].map(q).join(";")];
  journal().forEach(e=>{ const st=stackOf(e.code); rows.push([e.at, e.title, st.domName, st.auxName, ...e.answers].map(q).join(";")); });
  const blob = new Blob(["\ufeff"+rows.join("\n")], {type:"text/csv;charset=utf-8"});
  saveFile("igra-tipov-zhurnal.csv", blob);
}

/* ---------- UI ---------- */
function renderTest(){
  app.classList.add("full");
  if(T.phase==="result" && T.result) return renderResult();
  app.innerHTML = `
  <section class="chat" aria-label="Тест">
    <div class="chat-head">
      <span class="count">${T.phase==="chat" ? `Вопрос ${Math.min(T.step+1,QUESTIONS.length)} из ${QUESTIONS.length}` : "Разбор ответов"}</span>
      <button class="skip" id="restart">начать заново</button>
    </div>
    <div class="log" id="log" role="log" aria-live="polite"></div>
    <div class="composer" id="composer"></div>
  </section>`;
  document.getElementById("restart").onclick = restart;
  if(!T.msgs.length){ GREET.forEach(t=>T.msgs.push({from:"bot",text:t})); T.msgs.push({from:"bot",text:QUESTIONS[0].text,q:true}); save(); }
  drawLog(); drawComposer();
}

function drawLog(){
  const log = document.getElementById("log"); if(!log) return;
  log.innerHTML = T.msgs.map(m=>`<div class="msg ${m.from} ${m.q?'q':''}"></div>`).join("");
  [...log.children].forEach((el,i)=>{ el.textContent = T.msgs[i].text; });
  if(T.phase==="analyzing") log.insertAdjacentHTML("beforeend", `<div class="msg bot typing" id="status">${T.status||"Читаю ответы…"}</div>`);
  log.scrollTop = log.scrollHeight;
}

function drawComposer(){
  const c = document.getElementById("composer"); if(!c) return;
  c.classList.toggle("stack", T.phase==="error");
  if(T.phase==="chat"){
    c.innerHTML = `<label class="sr" for="ans">Твой ответ</label>
      <textarea id="ans" rows="2" placeholder="Своими словами…"></textarea>
      <button class="btn" id="send">Ответить</button>`;
    const ta = c.querySelector("textarea");
    ta.addEventListener("input", ()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,180)+"px"; });
    ta.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches){ e.preventDefault(); send(); } });
    c.querySelector("#send").onclick = send;
    ta.focus({preventScroll:true});
  } else if(T.phase==="tap"){
    c.innerHTML = `<div class="taps">${TAPS[T.step].map((t,i)=>`<button class="btn ghost tap" data-i="${i}">${t[1]}</button>`).join("")}</div>`;
    c.querySelectorAll(".tap").forEach(b=>b.onclick=()=>pickTap(+b.dataset.i));
  } else if(T.phase==="error"){
    c.innerHTML = `<p class="err">${T.error}</p><button class="btn" id="retry">Запустить разбор ещё раз</button>`;
    c.querySelector("#retry").onclick = analyze;
  } else c.innerHTML = "";
}

function botSay(text, extra={}){ T.msgs.push({from:"bot", text, ...extra}); save(); drawLog(); }

function send(){
  const ta = document.getElementById("ans"); const v = ta.value.trim(); if(!v) return;
  T.msgs.push({from:"me", text:v});
  T.answers[T.step] = (T.answers[T.step] ? T.answers[T.step]+" " : "") + v;
  ta.value = ""; ta.style.height = "auto"; save(); drawLog();
  const words = T.answers[T.step].split(/\s+/).length;
  setTimeout(()=>{
    if(words < 7 && !T.nudged){ T.nudged = true; botSay("Можно чуть подробнее? Пример из жизни очень помогает."); return; }
    T.nudged = false;
    if(TAPS[T.step]){ T.phase="tap"; save(); botSay("И коротко: что ближе?"); drawComposer(); return; }
    advance();
  }, reduce ? 0 : 350);
}
function pickTap(i){
  const [pole,label] = TAPS[T.step][i];
  T.taps[T.step] = pole; T.msgs.push({from:"me", text:label}); T.phase="chat"; save(); drawLog(); drawComposer();
  setTimeout(advance, reduce ? 0 : 300);
}
function advance(){
  { T.step++;
    if(T.step < QUESTIONS.length){
      botSay(REACT[(T.step-1) % REACT.length]);
      setTimeout(()=>{ botSay(QUESTIONS[T.step].text, {q:true}); refreshHead(); }, reduce ? 0 : 450);
    } else {
      botSay("Всё. Спасибо за честность. Секунду, складываю картину.");
      analyze();
    }
  }
}
function refreshHead(){ const h=document.querySelector(".chat-head .count"); if(h) h.textContent=`Вопрос ${T.step+1} из ${QUESTIONS.length}`; }

function analyze(){
  T.phase="analyzing"; T.status="Складываю картину…"; save(); drawLog(); drawComposer();
  setTimeout(()=>{ T.result = localAnalyze(); addJournal(T.result); T.phase="result"; save(); render(); }, reduce ? 0 : 1400);
}
function restart(){ T = fresh(); save(); render(); }

/* ---------- карточка для сторис 1080×1920 ---------- */
async function shareCard(st, line){
  await document.fonts?.ready;
  const W=1080, H=1920, c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  x.fillStyle="#DCD8EE"; x.fillRect(0,0,W,H);
  x.fillStyle="#F2BE2E"; for(let i=0;i<W;i+=26) for(let j=1100;j<H;j+=26){ x.beginPath(); x.arc(i+13,j+13,5,0,7); x.fill(); }
  x.fillStyle="#26235E"; x.fillRect(80,240,W-160,4);
  x.font="44px Pangolin, cursive"; x.fillText("мой тип", 80, 210);
  x.font="800 96px Unbounded, sans-serif";
  wrap(x, st.title, 80, 370, W-160, 110);
  x.font="44px Pangolin, cursive"; x.fillStyle="#5D5A96";
  wrap(x, `ведёт ${st.domName}, опора — ${st.auxName}`, 80, 620, W-160, 58);
  x.fillStyle="#26235E"; x.font="56px Pangolin, cursive";
  wrap(x, line||"", 80, 820, W-160, 72);
  x.fillStyle="#26235E"; x.fillRect(80,H-260,W-160,150);
  x.fillStyle="#F2BE2E"; x.font="700 44px Unbounded, sans-serif"; x.fillText("Игра типов", 120, H-168);
  x.font="36px Pangolin, cursive"; x.fillText("а какой твой?", 620, H-168);
  const blob = await new Promise(r=>c.toBlob(r,"image/png"));
  const file = new File([blob],"moy-tip.png",{type:"image/png"});
  try{ if(navigator.canShare?.({files:[file]})){ await navigator.share({files:[file], title:"Мой тип"}); return; } }catch(e){ if(e.name==="AbortError") return; }
  saveFile("moy-tip.png", blob);
}
function wrap(x, text, left, top, max, lh){
  const words=String(text).split(" "); let line="", y=top;
  for(const w of words){ const t=line? line+" "+w : w; if(x.measureText(t).width>max && line){ x.fillText(line,left,y); line=w; y+=lh; } else line=t; }
  if(line) x.fillText(line,left,y);
}

render();
</script>
